[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hoerbuchgenerator"
version = "0.1.0"
description = "Offline web application for voice cloning and audiobook synthesis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "gradio>=5.20,<6",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
]
whisper = [
    "av>=11,<19",
    "faster-whisper>=1.1,<2",
]
qwen = [
    "qwen-tts>=0.1.1,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
